<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每月工時 & KPI 自動填表系統 (智慧歸類版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .calendar-cell { min-height: 80px; transition: all 0.2s; cursor: pointer; }
    .calendar-cell:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); z-index: 10; border-color: #93c5fd; }
    .status-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 99px; }
    .status-ok { background: #d1fae5; color: #047857; }
    .status-err { background: #ffe4e6; color: #e11d48; animation: pulse 2s infinite; border: 1px solid #fecdd3; }
    .status-hol { background: #f1f5f9; color: #64748b; }
    .status-empty { background: #fef3c7; color: #d97706; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
    
    /* 滑出抽屜特效 */
    #drawerOverlay { transition: opacity 0.3s ease; }
    #editDrawer { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .drawer-open #drawerOverlay { opacity: 1; pointer-events: auto; }
    .drawer-open #editDrawer { transform: translateX(0); }
    .drawer-closed #drawerOverlay { opacity: 0; pointer-events: none; }
    .drawer-closed #editDrawer { transform: translateX(100%); }
    
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-20 drawer-closed">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center font-black text-xl shadow-inner tracking-tighter border border-blue-400/30">KPI</div>
        <div>
          <h1 class="text-base font-bold tracking-wide">工時 & KPI 自動填表系統</h1>
          <p class="text-[10px] text-blue-200">v9.1 智慧歸類版</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- 專案字庫按鈕 -->
        <button onclick="openDictModal()" class="px-3 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs font-bold transition flex items-center gap-1.5 border border-slate-700">
          📚 共用專案庫
        </button>
        <div id="userInfo" class="hidden items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
          <img id="userAvatar" class="w-5 h-5 rounded-full" src="" alt="avatar">
          <span id="userName" class="text-xs font-bold text-slate-300"></span>
          <button id="logoutBtn" class="text-[10px] text-slate-400 hover:text-white transition">登出</button>
        </div>
        <button id="loginBtn" class="px-4 py-1.5 rounded-lg bg-white hover:bg-slate-100 text-slate-900 text-xs font-bold transition shadow flex items-center gap-2">
          Google 登入
        </button>
        <button id="syncBtn" class="px-4 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-white text-xs font-bold transition shadow hidden items-center gap-1.5">
          ☁️ 儲存雲端
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 mt-6 space-y-6">
    
    <!-- 模組 1: 年月切換與資料匯入 -->
    <section class="glass-card rounded-2xl p-4 flex flex-col md:flex-row gap-4 items-center justify-between border-t-4 border-t-blue-500">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-black">1</div>
        <select id="yearSelect" onchange="onDateSelectChange()" class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-bold text-slate-700 bg-white outline-none cursor-pointer hover:border-blue-400 transition"></select>
        <select id="monthSelect" onchange="onDateSelectChange()" class="rounded-lg border border-slate-200 px-3 py-1.5 text-sm font-bold text-slate-700 bg-white outline-none cursor-pointer hover:border-blue-400 transition">
          <option value="01">01 月</option><option value="02">02 月</option><option value="03">03 月</option>
          <option value="04">04 月</option><option value="05">05 月</option><option value="06">06 月</option>
          <option value="07">07 月</option><option value="08">08 月</option><option value="09" selected>09 月</option>
          <option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option>
        </select>
      </div>

      <div class="flex flex-col sm:flex-row gap-3">
        <label class="relative flex items-center justify-center gap-2 px-4 py-2 rounded-xl border border-dashed border-blue-300 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold cursor-pointer transition">
          <span>📥 匯入 Excel 紀錄</span>
          <input type="file" id="worklogInput" accept=".xlsx,.xls" onchange="handleWorklogUpload(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
          <span id="worklogStatusBadge" class="bg-white px-1.5 py-0.5 rounded shadow-sm text-[9px] truncate max-w-[80px]">無資料</span>
        </label>
        
        <label class="relative flex items-center justify-center gap-2 px-4 py-2 rounded-xl border border-dashed border-emerald-300 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-xs font-bold cursor-pointer transition">
          <span>📄 上傳 KPI 範本</span>
          <input type="file" id="kpiTemplateInput" accept=".xlsx" onchange="handleKpiTemplateUpload(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
          <span id="templateStatusBadge" class="bg-white px-1.5 py-0.5 rounded shadow-sm text-[9px] truncate max-w-[80px]">未上傳</span>
        </label>
      </div>
    </section>

    <!-- 模組 2: 視覺化大月曆與數據 -->
    <section class="glass-card rounded-2xl p-6 border-t-4 border-t-amber-400">
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-4 gap-4">
        <h2 class="text-lg font-extrabold text-slate-800 flex items-center gap-2">
          <span class="w-8 h-8 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center font-black">2</span> 
          工時日曆大表 <span class="text-xs text-slate-400 font-normal ml-2">點擊日期格子即可新增或修改專案工時</span>
        </h2>
        
        <!-- 微縮版數據看板 -->
        <div class="flex items-center gap-3 text-[10px] font-bold bg-slate-50 px-4 py-2 rounded-xl border border-slate-200 w-full md:w-auto overflow-x-auto">
          <div class="flex flex-col items-center"><span class="text-slate-400">標準</span><span id="statBaseHours" class="text-sm text-slate-700">0h</span></div>
          <div class="w-px h-6 bg-slate-200"></div>
          <div class="flex flex-col items-center"><span class="text-slate-400">有效+加班</span><span id="statEffectiveHours" class="text-sm text-emerald-600">0h</span></div>
          <div class="w-px h-6 bg-slate-200"></div>
          <div class="flex flex-col items-center"><span class="text-slate-400">休假/無效</span><span id="statLeaveHours" class="text-sm text-rose-500">0h</span></div>
          <div class="w-px h-6 bg-slate-200"></div>
          <div class="flex flex-col items-center"><span class="text-amber-500">J4達成率</span><span id="statJ4Percent" class="text-sm text-amber-600 font-black">0%</span></div>
        </div>
      </div>

      <!-- 日曆網格區 -->
      <div class="border border-slate-200 rounded-xl overflow-hidden bg-slate-50 shadow-inner">
        <!-- 星期標題 -->
        <div class="grid grid-cols-7 bg-slate-100 border-b border-slate-200 text-[11px] font-black text-slate-500 text-center">
          <div class="py-2 text-rose-500">日</div><div class="py-2">一</div><div class="py-2">二</div>
          <div class="py-2">三</div><div class="py-2">四</div><div class="py-2">五</div><div class="py-2 text-rose-500">六</div>
        </div>
        <!-- 日曆本體 -->
        <div id="calendarGrid" class="grid grid-cols-7 auto-rows-fr bg-slate-200 gap-px">
          <!-- JS 動態生成 -->
        </div>
      </div>
    </section>

    <!-- 模組 3: KPI 草稿與匯出 -->
    <section class="glass-card rounded-2xl p-6 border-t-4 border-t-emerald-500">
      <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-5">
        <h2 class="text-lg font-extrabold text-slate-800 flex items-center gap-2">
          <span class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-black">3</span> KPI 草稿審閱與輸出
        </h2>
        <div class="flex items-center gap-3">
          <label class="text-[11px] font-bold text-slate-600 bg-slate-100 px-2 py-1.5 rounded cursor-pointer hover:bg-slate-200 transition"><input type="checkbox" id="crossYearReset" class="mr-1"> 跨年新開總表</label>
          <input type="text" id="newSheetNameInput" class="text-[11px] px-2 py-1.5 rounded border border-slate-300 w-24 text-center font-bold" placeholder="頁籤名稱">
          <button onclick="generateAllDrafts()" class="px-5 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white text-xs font-bold rounded-lg shadow-md transition transform hover:-translate-y-0.5 flex items-center gap-2">
            ✨ 雙引擎重新生成
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col shadow-sm">
          <h3 class="text-xs font-extrabold text-slate-700 mb-3 border-b border-slate-200 pb-2">📊 當月所有專案與任務工時總覽</h3>
          <div id="projectRankList" class="space-y-2 text-[11px] flex-1 overflow-y-auto pr-2"></div>
        </div>

        <div class="lg:col-span-2 space-y-4">
          <div class="grid grid-cols-2 gap-4">
            <div class="border border-orange-200 bg-orange-50/30 rounded-xl p-3 shadow-sm">
              <label class="block text-[11px] font-bold text-orange-900 mb-2">📌 J4 公式 (財務構面)</label>
              <textarea id="cellJ4Input" rows="2" class="w-full text-[10px] p-2 rounded border border-orange-200 outline-none bg-white text-slate-600"></textarea>
            </div>
            <div class="border border-orange-200 bg-orange-50/30 rounded-xl p-3 shadow-sm">
              <label class="block text-[11px] font-bold text-orange-900 mb-2">🎓 J14 內外訓 (學習構面) <span class="font-normal text-orange-600 ml-1 text-[9px]">(自動抓取訓練屬性任務)</span></label>
              <textarea id="cellJ14Input" rows="2" class="w-full text-[10px] p-2 rounded border border-orange-200 outline-none bg-white text-slate-600"></textarea>
            </div>
          </div>

          <div class="border border-slate-200 rounded-xl p-3 bg-white shadow-sm focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-100 transition">
            <div class="flex justify-between items-center mb-1.5">
                <label class="text-[11px] font-extrabold text-slate-700 flex items-center">
                    📌 J6 專案執行效益 <span id="j6Source"></span>
                </label>
                <button type="button" onclick="regenerateSingle('j6')" class="text-[10px] text-blue-600 hover:text-blue-800 font-bold bg-blue-50 px-2 py-0.5 rounded transition">🔄 換個說法</button>
            </div>
            <textarea id="cellJ6Input" oninput="autoSaveCloudData()" rows="3" class="w-full border-none p-1 text-[11px] font-medium text-slate-800 outline-none resize-none placeholder-slate-300 leading-relaxed" placeholder="系統將自動擷取排行專案與時數填入..."></textarea>
          </div>
          
          <div class="border border-slate-200 rounded-xl p-3 bg-white shadow-sm focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-100 transition">
            <div class="flex justify-between items-center mb-1.5">
                <label class="text-[11px] font-extrabold text-slate-700 flex items-center">
                    📌 J10 客戶 / 主管滿意度 <span id="j10Source"></span>
                </label>
                <button type="button" onclick="regenerateSingle('j10')" class="text-[10px] text-blue-600 hover:text-blue-800 font-bold bg-blue-50 px-2 py-0.5 rounded transition">🔄 換個說法</button>
            </div>
            <textarea id="cellJ10Input" oninput="autoSaveCloudData()" rows="3" class="w-full border-none p-1 text-[11px] font-medium text-slate-800 outline-none resize-none leading-relaxed"></textarea>
          </div>
          
          <div class="border border-slate-200 rounded-xl p-3 bg-white shadow-sm focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-100 transition">
            <div class="flex justify-between items-center mb-1.5">
                <label class="text-[11px] font-extrabold text-slate-700 flex items-center">
                    📌 J11 團隊滿意度 <span id="j11Source"></span>
                </label>
                <button type="button" onclick="regenerateSingle('j11')" class="text-[10px] text-blue-600 hover:text-blue-800 font-bold bg-blue-50 px-2 py-0.5 rounded transition">🔄 換個說法</button>
            </div>
            <textarea id="cellJ11Input" oninput="autoSaveCloudData()" rows="3" class="w-full border-none p-1 text-[11px] font-medium text-slate-800 outline-none resize-none leading-relaxed"></textarea>
          </div>
          <input type="hidden" id="cellH4Input">
          <input type="hidden" id="cellH14Input">
        </div>
      </div>

      <div class="mt-8 text-center border-t border-slate-100 pt-6">
        <button id="exportKpiBtn" onclick="exportFilledKpiWorkbook()" class="px-10 py-3.5 rounded-2xl font-black text-sm text-white bg-emerald-500 hover:bg-emerald-400 shadow-[0_4px_14px_0_rgba(16,185,129,0.39)] hover:shadow-[0_6px_20px_rgba(16,185,129,0.23)] transform hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 mx-auto disabled:bg-slate-400 disabled:shadow-none disabled:transform-none">
          <span class="text-xl">📥</span> 產出並下載 KPI Excel 報表
        </button>
      </div>
    </section>
  </main>

  <!-- 📚 共用專案字典 Modal -->
  <div id="dictModalOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 transition-transform" id="dictModalContent">
      <div class="bg-slate-800 px-5 py-3 flex justify-between items-center text-white">
        <h3 class="font-bold text-sm flex items-center gap-2">📚 跨月共用專案字典庫</h3>
        <button onclick="closeDictModal()" class="text-slate-400 hover:text-white text-lg leading-none">&times;</button>
      </div>
      <div class="p-5">
        <p class="text-[10px] text-slate-500 mb-4">在此新增您的常用專案名稱。這些名稱會儲存在您的雲端帳號中，未來填寫工時時即可使用下拉選單快速選取，免去重複打字。</p>
        <div class="flex gap-2 mb-4">
          <input type="text" id="newDictInput" placeholder="輸入常用專案名稱 (如: 程曦形象牆)" class="flex-1 border border-slate-300 rounded-lg px-3 py-1.5 text-xs outline-none focus:border-blue-500">
          <button onclick="addDictItem()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1.5 rounded-lg text-xs font-bold transition">新增</button>
        </div>
        <div class="max-h-60 overflow-y-auto border border-slate-100 rounded-lg bg-slate-50 p-2">
          <ul id="dictList" class="space-y-1"></ul>
        </div>
      </div>
    </div>
  </div>

  <!-- 📝 右側編輯抽屜 (Sidebar) -->
  <div id="drawerOverlay" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-50 flex justify-end" onclick="if(event.target===this) closeDrawer()">
    <div id="editDrawer" class="w-full max-w-sm bg-white h-full shadow-2xl flex flex-col border-l border-slate-200" onclick="event.stopPropagation()">
      <div class="bg-white border-b border-slate-100 px-5 py-4 flex justify-between items-center sticky top-0 z-10">
        <div>
          <h3 id="drawerTitle" class="font-black text-slate-800 text-base">編輯工時</h3>
          <p id="drawerSubtitle" class="text-[10px] text-slate-500 font-bold"></p>
        </div>
        <button onclick="closeDrawer()" class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 transition font-bold text-lg">&times;</button>
      </div>
      
      <!-- 一鍵複製昨日 -->
      <div class="px-5 py-3 bg-blue-50/50 border-b border-blue-100 flex justify-between items-center">
        <span class="text-[10px] text-blue-700 font-bold">💡 懶人輸入</span>
        <button onclick="copyFromYesterday()" class="bg-white border border-blue-200 text-blue-600 hover:bg-blue-600 hover:text-white hover:border-blue-600 text-[10px] font-bold px-3 py-1 rounded shadow-sm transition flex items-center gap-1">
          📋 複製昨日任務
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-5 space-y-4 bg-slate-50/30" id="drawerTaskList">
        <!-- 任務列表由 JS 生成 -->
      </div>
      
      <div class="p-5 border-t border-slate-100 bg-white sticky bottom-0 flex justify-between items-center shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
        <div class="text-xs font-bold text-slate-700">單日總計: <span id="drawerTotalHours" class="text-lg font-black ml-1">0</span><span class="text-[10px] text-slate-400">h</span></div>
        <button onclick="closeDrawer()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-2 rounded-xl shadow-md transition text-xs">完成並儲存</button>
      </div>
    </div>
  </div>

  <!-- 用於 autocomplete 的隱藏 datalist -->
  <datalist id="projectDictList"></datalist>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCyQxQSBWWu99hl9M_-Iclxd5kTf0pQoEI",
      authDomain: "chainsea-kpi.firebaseapp.com",
      projectId: "chainsea-kpi",
      storageBucket: "chainsea-kpi.firebasestorage.app",
      messagingSenderId: "162512702783",
      appId: "1:162512702783:web:dbbcefa7627b86ab3dd78a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    window.firebaseDB = db;
    window.firebaseGetDoc = getDoc;
    window.firebaseDoc = doc;

    let currentUser = null;

    document.getElementById('loginBtn').addEventListener('click', () => {
      signInWithPopup(auth, provider).catch(error => alert("登入失敗: " + error.message));
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      signOut(auth).then(() => { location.reload(); });
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('loginBtn').classList.add('hidden');
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('userInfo').classList.add('flex');
        document.getElementById('syncBtn').classList.remove('hidden');
        document.getElementById('syncBtn').classList.add('flex');
        document.getElementById('userName').textContent = user.displayName;
        document.getElementById('userAvatar').src = user.photoURL;
        
        await loadFromCloud();
      } else {
        currentUser = null;
        document.getElementById('loginBtn').classList.remove('hidden');
        document.getElementById('userInfo').classList.add('hidden');
        document.getElementById('userInfo').classList.remove('flex');
        document.getElementById('syncBtn').classList.add('hidden');
        document.getElementById('syncBtn').classList.remove('flex');
      }
    });

    document.getElementById('syncBtn').addEventListener('click', async () => {
      if (!currentUser) return alert("請先登入 Google 帳號！");
      const btn = document.getElementById('syncBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<span>⏳ 儲存中...</span>`;
      btn.disabled = true;

      try {
        window.autoSaveCloudData();
        const payload = { cloudData: window.cloudData, timestamp: Date.now() };
        await setDoc(doc(db, "kpi_users", currentUser.uid), payload);
        
        const b = document.getElementById('syncBtn');
        b.innerHTML = `✅ 儲存成功`;
        b.classList.remove('bg-emerald-500'); b.classList.add('bg-blue-500');
        setTimeout(() => { 
            b.innerHTML = originalText; 
            b.classList.add('bg-emerald-500'); b.classList.remove('bg-blue-500');
            b.disabled = false;
        }, 2000);
      } catch (e) {
        alert("儲存失敗：" + e.message);
        btn.innerHTML = originalText; btn.disabled = false;
      }
    });

    async function loadFromCloud() {
      if (!currentUser) return;
      try {
        const docSnap = await getDoc(doc(db, "kpi_users", currentUser.uid));
        if (docSnap.exists()) {
          const data = docSnap.data();
          window.cloudData = data.cloudData || { monthly: {}, globalSettings: { projects: [] } };
          
          if(!window.cloudData.globalSettings) window.cloudData.globalSettings = { projects: [] };
          window.projectDictionary = window.cloudData.globalSettings.projects || [];
          renderDictList();

          if (window.cloudData.template && window.cloudData.template.base64) {
              window.kpiTemplateFileName = window.cloudData.template.fileName;
              window.kpiTemplateBase64 = window.cloudData.template.base64;
              window.kpiTemplateArrayBuffer = window.base64ToArrayBuffer(window.kpiTemplateBase64);
              const b2 = document.getElementById("templateStatusBadge");
              b2.className = "bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded shadow-sm text-[9px] truncate max-w-[80px]";
              b2.textContent = window.kpiTemplateFileName;
          }
          window.onDateSelectChange();
        }
      } catch (e) { console.error("雲端讀取失敗", e); }
    }
  </script>

  <script>
    window.parsedSheetsData = []; 
    window.manualOverrides = {};
    window.worklogFileName = "";
    window.kpiTemplateFileName = "";
    window.kpiTemplateBase64 = "";
    window.kpiTemplateArrayBuffer = null;
    window.cloudData = { monthly: {}, globalSettings: { projects: [] }, template: {} };
    window.projectDictionary = [];
    window.currentEditingMmdd = null;

    const WEEKDAY_NAMES = ["日", "一", "二", "三", "四", "五", "六"];

    window.arrayBufferToBase64 = function(buffer) {
        let binary = ''; let bytes = new Uint8Array(buffer);
        for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
        return window.btoa(binary);
    }
    window.base64ToArrayBuffer = function(base64) {
        let binary_string = window.atob(base64); let bytes = new Uint8Array(binary_string.length);
        for (let i = 0; i < binary_string.length; i++) { bytes[i] = binary_string.charCodeAt(i); }
        return bytes.buffer;
    }

    window.onload = function() {
      initYearSelect();
      onDateSelectChange();
    };

    function initYearSelect() {
      const yearSelect = document.getElementById("yearSelect");
      const currentYear = new Date().getFullYear();
      let html = "";
      for (let y = 2025; y <= 2035; y++) {
        html += `<option value="${y}" ${y === currentYear ? "selected" : ""}>${y} 年 (民國${y - 1911}年)</option>`;
      }
      yearSelect.innerHTML = html;
      document.getElementById("monthSelect").value = String(new Date().getMonth() + 1).padStart(2, '0');
      updateSheetNamePreview();
    }

    function updateSheetNamePreview() {
      const year = document.getElementById("yearSelect").value;
      const month = document.getElementById("monthSelect").value;
      document.getElementById("newSheetNameInput").value = `${parseInt(year, 10) - 1911}年${month}月KPI`;
    }

    async function fetchTaiwanCalendar(year) {
      const cacheKey = `dgpa_cache_${year}`;
      if (localStorage.getItem(cacheKey)) return true;
      try {
        const res = await fetch(`https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/${year}.json`);
        if (!res.ok) return false;
        const data = await res.json();
        const overridesByMonth = {};
        data.forEach(d => {
          const m = d.date.substring(4, 6);
          const mmdd = m + d.date.substring(6, 8);
          if (!overridesByMonth[m]) overridesByMonth[m] = {};
          overridesByMonth[m][mmdd] = d.isHoliday ? "holiday" : "workday";
        });
        for (const [m, overrides] of Object.entries(overridesByMonth)) {
          if (!localStorage.getItem(`kpi_holidays_${year}_${m}`)) localStorage.setItem(`kpi_holidays_${year}_${m}`, JSON.stringify(overrides));
        }
        localStorage.setItem(cacheKey, "true");
        return true;
      } catch (e) { return false; }
    }

    function getDaysInMonthInfo(year, monthStr) {
      const y = parseInt(year, 10), m = parseInt(monthStr, 10);
      const daysInMonth = new Date(y, m, 0).getDate();
      const firstDow = new Date(y, m - 1, 1).getDay(); // 第一天星期幾
      const overrides = JSON.parse(localStorage.getItem(`kpi_holidays_${y}_${monthStr}`) || "{}");
      const days = [];
      let totalWorkdays = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const dow = new Date(y, m - 1, d).getDay();
        const mmdd = String(monthStr).padStart(2, '0') + String(d).padStart(2, '0');
        let isWorkday = (dow !== 0 && dow !== 6);
        if (overrides[mmdd] === "holiday") isWorkday = false;
        if (overrides[mmdd] === "workday") isWorkday = true;
        if (isWorkday) totalWorkdays++;
        days.push({ mmdd, day: d, dowName: WEEKDAY_NAMES[dow], dow, isWorkday });
      }
      return { days, totalWorkdays, firstDow };
    }

    window.restoreMonthData = function() {
      const ym = document.getElementById("yearSelect").value + "-" + document.getElementById("monthSelect").value;
      const mData = (window.cloudData && window.cloudData.monthly && window.cloudData.monthly[ym]) ? window.cloudData.monthly[ym] : null;
      
      const b1 = document.getElementById("worklogStatusBadge");
      window.manualOverrides = {}; 

      if (mData && mData.worklogData && mData.worklogData.length > 0) {
          window.parsedSheetsData = mData.worklogData;
          if (mData.manualOverrides) window.manualOverrides = mData.manualOverrides;
          window.worklogFileName = mData.worklogFileName || "";
          document.getElementById('cellJ6Input').value = mData.draftJ6 || "";
          document.getElementById('cellJ10Input').value = mData.draftJ10 || "";
          document.getElementById('cellJ11Input').value = mData.draftJ11 || "";
          b1.className = "bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded shadow-sm text-[9px] truncate max-w-[80px]";
          b1.textContent = window.worklogFileName || "已載入";
      } else if (mData && mData.manualOverrides && Object.keys(mData.manualOverrides).length > 0) {
          window.parsedSheetsData = [];
          window.manualOverrides = mData.manualOverrides;
          document.getElementById('cellJ6Input').value = mData.draftJ6 || "";
          document.getElementById('cellJ10Input').value = mData.draftJ10 || "";
          document.getElementById('cellJ11Input').value = mData.draftJ11 || "";
          b1.className = "bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded shadow-sm text-[9px] truncate max-w-[80px]";
          b1.textContent = "純日曆記錄";
      } else {
          window.parsedSheetsData = [];
          window.worklogFileName = "";
          document.getElementById('cellJ6Input').value = "";
          document.getElementById('cellJ10Input').value = "";
          document.getElementById('cellJ11Input').value = "";
          b1.className = "bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded shadow-sm text-[9px] truncate max-w-[80px]";
          b1.textContent = "無資料";
          resetSourceTags();
      }
      window.recalculateAndRenderAll();
    }

    window.onDateSelectChange = async function() {
      const year = document.getElementById("yearSelect").value;
      await fetchTaiwanCalendar(year);
      updateSheetNamePreview();
      window.restoreMonthData(); 
    }

    // --- 字典功能 ---
    window.openDictModal = function() {
        renderDictList();
        const o = document.getElementById('dictModalOverlay');
        const c = document.getElementById('dictModalContent');
        o.classList.remove('hidden');
        // trigger reflow
        void o.offsetWidth;
        o.classList.remove('opacity-0');
        c.classList.remove('scale-95');
    }
    window.closeDictModal = function() {
        const o = document.getElementById('dictModalOverlay');
        const c = document.getElementById('dictModalContent');
        o.classList.add('opacity-0');
        c.classList.add('scale-95');
        setTimeout(() => o.classList.add('hidden'), 300);
    }
    window.addDictItem = function() {
        const inp = document.getElementById('newDictInput');
        const val = inp.value.trim();
        if(!val) return;
        if(!window.projectDictionary.includes(val)) {
            window.projectDictionary.push(val);
            saveDictToCloud();
            renderDictList();
        }
        inp.value = "";
    }
    window.removeDictItem = function(val) {
        window.projectDictionary = window.projectDictionary.filter(v => v !== val);
        saveDictToCloud();
        renderDictList();
    }
    function renderDictList() {
        const dl = document.getElementById('dictList');
        if(window.projectDictionary.length === 0) {
            dl.innerHTML = `<li class="text-[10px] text-slate-400 text-center py-2">尚未建立常用專案</li>`;
        } else {
            dl.innerHTML = window.projectDictionary.map(p => `
                <li class="flex justify-between items-center bg-white px-3 py-1.5 rounded border border-slate-100 shadow-sm text-xs font-bold text-slate-700">
                    <span>${p}</span>
                    <button onclick="removeDictItem('${p}')" class="text-rose-400 hover:text-rose-600 font-normal">&times;</button>
                </li>
            `).join("");
        }
        
        const dlist = document.getElementById('projectDictList');
        dlist.innerHTML = window.projectDictionary.map(p => `<option value="${p}">`).join("");
    }
    function saveDictToCloud() {
        if(!window.cloudData) window.cloudData = { monthly: {}, globalSettings: { projects: [] } };
        if(!window.cloudData.globalSettings) window.cloudData.globalSettings = {};
        window.cloudData.globalSettings.projects = window.projectDictionary;
        if(currentUser && window.firebaseDB) {
            setDoc(doc(window.firebaseDB, "kpi_users", currentUser.uid), { cloudData: window.cloudData, timestamp: Date.now() }).catch(e=>console.log(e));
        }
    }

    // --- 大月曆與側邊抽屜 ---
    window.openDrawer = function(mmdd) {
        window.currentEditingMmdd = mmdd;
        const dInfo = window.getComputedMonthData().computedDays.find(c => c.mmdd === mmdd);
        document.getElementById('drawerTitle').innerText = `${mmdd.slice(0,2)}月${mmdd.slice(2,4)}日`;
        document.getElementById('drawerSubtitle').innerHTML = dInfo.isWorkday ? `<span class="text-emerald-600">上班日 (應滿 8 小時)</span>` : `<span class="text-slate-400">休假日</span>`;
        
        renderDrawerTasks(mmdd);
        
        document.body.classList.remove('drawer-closed');
        document.body.classList.add('drawer-open');
    }
    window.closeDrawer = function() {
        document.body.classList.remove('drawer-open');
        document.body.classList.add('drawer-closed');
        window.currentEditingMmdd = null;
        window.autoSaveCloudData();
        window.recalculateAndRenderAll();
    }

    window.copyFromYesterday = function() {
        if(!window.currentEditingMmdd) return;
        const mmdd = window.currentEditingMmdd;
        const year = document.getElementById("yearSelect").value;
        const dStr = `2026-${mmdd.slice(0,2)}-${mmdd.slice(2,4)}`; 
        const dateObj = new Date(year, parseInt(mmdd.slice(0,2))-1, parseInt(mmdd.slice(2,4)));
        dateObj.setDate(dateObj.getDate() - 1);
        
        if(dateObj.getMonth() !== parseInt(mmdd.slice(0,2))-1) return alert("無法跨月複製昨日任務！");
        
        const y_mmdd = String(dateObj.getMonth()+1).padStart(2,'0') + String(dateObj.getDate()).padStart(2,'0');
        const data = window.getComputedMonthData();
        const yInfo = data.computedDays.find(c => c.mmdd === y_mmdd);
        
        if(!yInfo || yInfo.tasks.length === 0) return alert("昨日無任何任務紀錄！");
        
        if (!window.manualOverrides) window.manualOverrides = {};
        window.manualOverrides[mmdd] = yInfo.tasks.map(t => ({...t}));
        renderDrawerTasks(mmdd);
    }

    function renderDrawerTasks(mmdd) {
        const data = window.getComputedMonthData();
        const dInfo = data.computedDays.find(c => c.mmdd === mmdd);
        const listEl = document.getElementById('drawerTaskList');
        
        let html = "";
        dInfo.tasks.forEach((t, idx) => {
            html += `
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 relative group transition hover:border-blue-300">
                <button onclick="removeDailyTask('${mmdd}', ${idx})" class="absolute -top-2 -right-2 w-5 h-5 bg-rose-100 text-rose-600 rounded-full text-xs font-bold opacity-0 group-hover:opacity-100 transition shadow">✕</button>
                <div class="flex gap-2 mb-2">
                    <div class="flex-1">
                        <label class="block text-[9px] text-slate-400 font-bold mb-0.5 uppercase tracking-wider">專案名稱</label>
                        <input list="projectDictList" value="${t.task}" onchange="updateDailyTaskSilent('${mmdd}', ${idx}, 'task', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded p-1.5 text-xs font-bold text-slate-800 outline-none focus:border-blue-500 transition shadow-inner" placeholder="下拉選取或輸入...">
                    </div>
                    <div class="w-16">
                        <label class="block text-[9px] text-slate-400 font-bold mb-0.5 uppercase tracking-wider">時數</label>
                        <input type="number" step="0.5" value="${t.hours}" onchange="updateDailyTaskSilent('${mmdd}', ${idx}, 'hours', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded p-1.5 text-xs font-black text-center text-blue-600 outline-none focus:border-blue-500 transition shadow-inner">
                    </div>
                </div>
                <div class="flex gap-1">
                    <button onclick="setTaskMode('${mmdd}', ${idx}, 'valid')" class="flex-1 py-1 rounded text-[10px] font-bold transition border ${t.mode==='valid' ? 'bg-emerald-100 border-emerald-300 text-emerald-700 shadow-inner scale-95':'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}">有效</button>
                    <button onclick="setTaskMode('${mmdd}', ${idx}, 'ot')" class="flex-1 py-1 rounded text-[10px] font-bold transition border ${t.mode==='ot' ? 'bg-blue-100 border-blue-300 text-blue-700 shadow-inner scale-95':'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}">加班</button>
                    <button onclick="setTaskMode('${mmdd}', ${idx}, 'leave')" class="flex-1 py-1 rounded text-[10px] font-bold transition border ${t.mode==='leave' ? 'bg-rose-100 border-rose-300 text-rose-700 shadow-inner scale-95':'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}">休假</button>
                    <button onclick="setTaskMode('${mmdd}', ${idx}, 'invalid')" class="flex-1 py-1 rounded text-[10px] font-bold transition border ${t.mode==='invalid' ? 'bg-amber-100 border-amber-300 text-amber-700 shadow-inner scale-95':'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}">訓練/無效</button>
                </div>
            </div>`;
        });
        
        html += `<button onclick="addDailyTask('${mmdd}')" class="w-full py-3 rounded-xl border-2 border-dashed border-slate-300 text-slate-500 text-xs font-bold hover:bg-slate-100 hover:border-slate-400 hover:text-slate-700 transition flex items-center justify-center gap-2"><span>＋</span> 新增任務</button>`;
        
        listEl.innerHTML = html;
        document.getElementById('drawerTotalHours').innerText = dInfo.total;
        
        if (dInfo.isWorkday && dInfo.total < 8) {
            document.getElementById('drawerTotalHours').classList.add('text-rose-600');
        } else {
            document.getElementById('drawerTotalHours').classList.remove('text-rose-600');
        }
    }

    window.updateDailyTaskSilent = function(mmdd, index, field, value) {
        if (!window.manualOverrides[mmdd]) {
            const dInfo = window.getComputedMonthData().computedDays.find(c => c.mmdd === mmdd);
            window.manualOverrides[mmdd] = dInfo.tasks.map(t => ({...t}));
        }
        if (field === 'hours') window.manualOverrides[mmdd][index][field] = parseFloat(value) || 0;
        else window.manualOverrides[mmdd][index][field] = value;
        renderDrawerTasks(mmdd); 
    }
    
    window.setTaskMode = function(mmdd, index, mode) {
        updateDailyTaskSilent(mmdd, index, 'mode', mode);
    }

    window.addDailyTask = function(mmdd) {
        if (!window.manualOverrides[mmdd]) {
            const dInfo = window.getComputedMonthData().computedDays.find(c => c.mmdd === mmdd);
            window.manualOverrides[mmdd] = dInfo.tasks.map(t => ({...t}));
        }
        window.manualOverrides[mmdd].push({ task: "", hours: 0, mode: "valid" });
        renderDrawerTasks(mmdd);
    }

    window.removeDailyTask = function(mmdd, index) {
        if (!window.manualOverrides[mmdd]) {
            const dInfo = window.getComputedMonthData().computedDays.find(c => c.mmdd === mmdd);
            window.manualOverrides[mmdd] = dInfo.tasks.map(t => ({...t}));
        }
        window.manualOverrides[mmdd].splice(index, 1);
        renderDrawerTasks(mmdd);
    }

    function renderBigCalendar(daysInfo, computedDays) {
        const grid = document.getElementById("calendarGrid");
        let html = "";
        
        for(let i=0; i<daysInfo.firstDow; i++) {
            html += `<div class="bg-white/50 border-r border-b border-slate-200/50 min-h-[80px]"></div>`;
        }
        
        computedDays.forEach(c => {
            const isUnder8 = c.isWorkday && c.total < 8;
            const isEmpty = c.tasks.length === 0;
            
            let bgClass = "bg-white";
            let hoverClass = "hover:bg-blue-50";
            let statusBadge = "";
            let numColor = "text-slate-700";
            
            if (!c.isWorkday) {
                bgClass = "bg-slate-50";
                if(c.total > 0) statusBadge = `<div class="status-badge status-ok ml-auto">${c.total}h</div>`;
                else statusBadge = `<div class="status-badge status-hol ml-auto">假日</div>`;
            } else {
                if (isEmpty) {
                    bgClass = "bg-amber-50/30";
                    hoverClass = "hover:bg-amber-100/50";
                    statusBadge = `<div class="status-badge status-empty ml-auto shadow-sm">未填寫</div>`;
                    numColor = "text-slate-300";
                } else if (isUnder8) {
                    bgClass = "bg-rose-50/50";
                    hoverClass = "hover:bg-rose-100";
                    statusBadge = `<div class="status-badge status-err ml-auto shadow-sm">缺時數</div>`;
                    numColor = "text-rose-600";
                } else {
                    statusBadge = `<div class="status-badge status-ok ml-auto bg-emerald-100 text-emerald-700 border-none shadow-sm">達標</div>`;
                    numColor = "text-slate-800";
                }
            }

            let tasksPreview = "";
            if (c.tasks.length > 0) {
                tasksPreview = c.tasks.slice(0,2).map(t => `<div class="text-[9px] truncate text-slate-500 mb-0.5">· ${t.task||'無名稱'}</div>`).join("");
                if (c.tasks.length > 2) tasksPreview += `<div class="text-[9px] text-slate-400 font-bold">+${c.tasks.length-2}項</div>`;
            }

            html += `
            <div onclick="openDrawer('${c.mmdd}')" class="calendar-cell p-1.5 border-r border-b border-slate-200 relative flex flex-col justify-between ${bgClass} ${hoverClass}">
                <div class="flex justify-between items-start mb-1">
                    <span class="text-xs font-black ${c.isWorkday ? 'text-slate-600' : 'text-rose-400'} ${c.mmdd===window.currentEditingMmdd?'text-blue-600':''} w-5 h-5 flex items-center justify-center rounded-full ${c.mmdd===window.currentEditingMmdd?'bg-blue-100':''}">${c.dateLabel.split(' ')[0]}</span>
                    ${statusBadge}
                </div>
                <div class="flex-1 overflow-hidden pointer-events-none">${tasksPreview}</div>
                <div class="text-right pointer-events-none mt-1">
                    <span class="text-lg font-black tracking-tighter ${numColor}">${c.total}<span class="text-[9px] font-normal ml-0.5">h</span></span>
                </div>
            </div>`;
        });
        
        const totalCells = daysInfo.firstDow + computedDays.length;
        const remain = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
        for(let i=0; i<remain; i++) {
            html += `<div class="bg-white/50 border-r border-b border-slate-200/50 min-h-[80px]"></div>`;
        }
        
        grid.innerHTML = html;
    }

    window.autoSaveCloudData = function() {
        const ym = document.getElementById("yearSelect").value + "-" + document.getElementById("monthSelect").value;
        if (!window.cloudData.monthly[ym]) window.cloudData.monthly[ym] = {};
        window.cloudData.monthly[ym].draftJ6 = document.getElementById('cellJ6Input').value;
        window.cloudData.monthly[ym].draftJ10 = document.getElementById('cellJ10Input').value;
        window.cloudData.monthly[ym].draftJ11 = document.getElementById('cellJ11Input').value;
        window.cloudData.monthly[ym].manualOverrides = window.manualOverrides;
    }

    window.handleWorklogUpload = function(event) {
      const file = event.target.files[0];
      if (!file) return;
      window.worklogFileName = file.name;
      const reader = new FileReader();
      reader.onload = function(e) {
        const workbook = XLSX.read(new Uint8Array(e.target.result), { type: "array", cellDates: true });
        const sheets = [];
        let rowIdCounter = 1;
        workbook.SheetNames.forEach(sheetName => {
          const ws = workbook.Sheets[sheetName];
          const rowsAoA = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false });
          if (!rowsAoA || rowsAoA.length === 0) return;
          const items = [];
          for (let r = 1; r < rowsAoA.length; r++) {
            const row = rowsAoA[r];
            if (!row) continue;
            let task = row[0] !== undefined && row[0] !== null ? String(row[0]).trim() : "";
            let hours = row[2] !== undefined && row[2] !== null && row[2] !== "" ? parseFloat(row[2]) : 0;
            let validFlag = row[4] !== undefined && row[4] !== null ? String(row[4]).trim() : "";
            let mode = "valid";
            if (task.includes("請假") || task.includes("休假") || task.includes("特休") || task.includes("病假") || task.includes("事假")) mode = "leave";
            else if (validFlag.includes("不列入")) mode = "exclude";
            else if (validFlag === "無" || validFlag.includes("無效")) mode = "invalid";
            else if (task.includes("加班") || task.startsWith("報加班")) mode = "ot";

            if ((hours && !isNaN(hours) && hours > 0) || validFlag !== "") {
              items.push({ id: rowIdCounter++, sheetName: sheetName.trim(), task, hours: isNaN(hours) ? 0 : hours, validFlag, mode });
            }
          }
          sheets.push({ sheetName: sheetName.trim(), rows: items });
        });
        window.parsedSheetsData = sheets;
        window.manualOverrides = {}; 
        
        const ym = document.getElementById("yearSelect").value + "-" + document.getElementById("monthSelect").value;
        if (!window.cloudData.monthly[ym]) window.cloudData.monthly[ym] = {};
        window.cloudData.monthly[ym].worklogData = sheets;
        window.cloudData.monthly[ym].manualOverrides = {};
        window.cloudData.monthly[ym].worklogFileName = file.name;

        const b1 = document.getElementById("worklogStatusBadge");
        b1.className = "bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded shadow-sm text-[9px] truncate max-w-[80px]";
        b1.textContent = file.name;
        
        resetSourceTags();
        window.recalculateAndRenderAll();
        if (!document.getElementById('cellJ6Input').value) window.generateAllDrafts(true);
      };
      reader.readAsArrayBuffer(file);
    }

    window.getComputedMonthData = function() {
        const year = document.getElementById("yearSelect").value;
        const month = document.getElementById("monthSelect").value;
        const daysInfo = getDaysInMonthInfo(year, month);
        
        const computedDays = [];
        let totalValid = 0, totalOt = 0, totalInvalid = 0, totalLeave = 0;
        const projectMap = new Map();
        const allTasksMap = new Map(); 

        daysInfo.days.forEach(d => {
            let tasks = [];
            if (window.manualOverrides[d.mmdd] && Array.isArray(window.manualOverrides[d.mmdd])) {
                tasks = window.manualOverrides[d.mmdd].map(t => ({...t}));
            } else {
                const sheet = window.parsedSheetsData.find(s => s.sheetName === d.mmdd || s.sheetName.includes(d.mmdd) || (parseInt(s.sheetName,10)==parseInt(d.mmdd,10)));
                if (sheet && sheet.rows) tasks = sheet.rows.map(r => ({...r}));
            }

            let valid = 0, ot = 0, invalid = 0, leave = 0, exclude = 0;
            tasks.forEach(t => {
                let h = parseFloat(t.hours) || 0;
                if (t.mode === 'valid') valid += h;
                else if (t.mode === 'ot') ot += h;
                else if (t.mode === 'invalid') invalid += h;
                else if (t.mode === 'leave') leave += h;
                else if (t.mode === 'exclude') exclude += h;

                let name = (t.task || "").replace(/^(報加班|加班-|加班)/, "").trim() || "一般任務";
                allTasksMap.set(name, (allTasksMap.get(name) || 0) + h);
                if (t.mode === 'valid' || t.mode === 'ot') {
                    projectMap.set(name, (projectMap.get(name) || 0) + h);
                }
            });

            const total = valid + ot + invalid + leave;
            totalValid += valid; totalOt += ot; totalInvalid += invalid; totalLeave += leave;

            computedDays.push({
                mmdd: d.mmdd,
                dateLabel: `${d.day} (${d.dowName})`,
                isWorkday: d.isWorkday,
                tasks, valid, ot, invalid, leave, exclude, total
            });
        });

        return { daysInfo, computedDays, totalValid, totalOt, totalInvalid, totalLeave, projectMap, allTasksMap };
    }

    window.recalculateAndRenderAll = function() {
        if ((!window.parsedSheetsData || window.parsedSheetsData.length === 0) && Object.keys(window.manualOverrides).length === 0) {
            document.getElementById("statBaseHours").innerHTML = `0<span class="text-xs font-normal">h</span>`;
            document.getElementById("statOtHours").innerHTML = `0<span class="text-xs font-normal">h</span>`;
            document.getElementById("statInvalidHours").innerHTML = `0<span class="text-xs font-normal">h</span>`;
            document.getElementById("statLeaveHours").innerHTML = `0<span class="text-xs font-normal">h</span>`;
            document.getElementById("statEffectiveHours").innerHTML = `0<span class="text-xs font-normal">h</span>`;
            document.getElementById("statJ4Percent").textContent = `0%`;
            document.getElementById("statH4Score").textContent = `0`;
            document.getElementById("projectRankList").innerHTML = `<div class="text-slate-400 text-[11px] py-2">無專案工時資料</div>`;
            const data = window.getComputedMonthData();
            renderBigCalendar(data.daysInfo, data.computedDays);
            return;
        }

        const data = window.getComputedMonthData();
        const stdBaseHours = data.daysInfo.totalWorkdays * 8;
        const targetHours = +(stdBaseHours * 0.8).toFixed(2);

        document.getElementById("statBaseHours").innerHTML = `${stdBaseHours}<span class="text-xs font-normal">h</span>`;
        document.getElementById("statOtHours").innerHTML = `${data.totalOt}<span class="text-xs font-normal">h</span>`;
        document.getElementById("statInvalidHours").innerHTML = `${data.totalInvalid}<span class="text-xs font-normal">h</span>`;
        document.getElementById("statLeaveHours").innerHTML = `${data.totalLeave}<span class="text-xs font-normal">h</span>`;
        
        const effectiveHours = stdBaseHours + data.totalOt - data.totalInvalid - data.totalLeave;
        const j4Percent = targetHours > 0 ? (effectiveHours / targetHours) * 100 : 0;
        const h4Score = Math.min(Math.round(j4Percent * 100) / 100, 120);

        document.getElementById("statEffectiveHours").innerHTML = `${effectiveHours}<span class="text-xs font-normal">h</span>`;
        document.getElementById("statJ4Percent").textContent = `${j4Percent.toFixed(1)}%`;
        document.getElementById("statH4Score").textContent = `${h4Score === 120 ? 120 : j4Percent.toFixed(1)}`;

        document.getElementById("cellH4Input").value = h4Score === 120 ? 120 : Math.round(j4Percent);
        const j4FormulaParts = `${data.daysInfo.totalWorkdays}x8` + (data.totalOt > 0 ? `+${data.totalOt}` : "") + (data.totalInvalid > 0 ? `-${data.totalInvalid}` : "") + (data.totalLeave > 0 ? `-${data.totalLeave}` : "");
        document.getElementById("cellJ4Input").value = `實際有效工時：${effectiveHours}小時(${j4FormulaParts})\n最高分數以120分計算。\n(${effectiveHours} / (${data.daysInfo.totalWorkdays} x 8 x 0.8=${targetHours})) * 100% = ${j4Percent.toFixed(2)}%`;

        updateJ14TrainingBox(data.computedDays);
        renderBigCalendar(data.daysInfo, data.computedDays);
        renderProjectRanking(data.allTasksMap);
    }

    function updateJ14TrainingBox(computedDays) {
      const trainingTasks = [];
      computedDays.forEach(c => {
          c.tasks.forEach(t => {
              const taskName = t.task || "";
              if (taskName.includes("訓練") || taskName.includes("課程") || taskName.includes("講座") || t.mode === "exclude") {
                  trainingTasks.push({ dateStr: c.mmdd, task: taskName, hours: parseFloat(t.hours) || 0 });
              }
          });
      });
      const totalTrainHours = trainingTasks.reduce((acc, cur) => acc + cur.hours, 0);
      const trainScore = Math.round((totalTrainHours / 4) * 100);
      document.getElementById("cellH14Input").value = totalTrainHours >= 4 ? 100 : trainScore;
      const lines = trainingTasks.map(tr => `${parseInt(tr.dateStr.slice(0, 2), 10)}/${tr.dateStr.slice(2, 4)}完成${tr.hours}hrs- ${tr.task}`);
      document.getElementById("cellJ14Input").value = `${lines.join("\n")}\n${totalTrainHours}/4*100%=${trainScore},得分${trainScore}分。`;
    }

    // 🌟 v9.1 智慧自動分組排行榜
    function renderProjectRanking(allTasksMap) {
        const rankListEl = document.getElementById("projectRankList");
        if(allTasksMap.size === 0) {
            rankListEl.innerHTML = '<div class="text-slate-400 text-[11px] py-2">無專案工時資料</div>';
            return;
        }

        const groups = {};
        
        Array.from(allTasksMap.entries()).forEach(([rawName, hrs]) => {
            let mainTask = rawName;
            let subTask = "";

            const dashMatch = rawName.match(/[-—_]/);
            if (dashMatch) {
                const parts = rawName.split(dashMatch[0]);
                mainTask = parts[0].trim();
                subTask = parts.slice(1).join(dashMatch[0]).trim();
            } 
            else if (rawName === "請假" || rawName === "休假" || rawName === "事假" || rawName === "病假") {
                mainTask = "🏖️ 請休假";
            }
            else {
                mainTask = rawName.trim();
            }

            if (!groups[mainTask]) {
                groups[mainTask] = { totalHrs: 0, items: [] };
            }
            
            groups[mainTask].totalHrs += hrs;
            if (subTask) {
                groups[mainTask].items.push({ name: subTask, hrs: hrs });
            } else if (rawName !== mainTask || groups[mainTask].items.length === 0) {
                groups[mainTask].items.push({ name: "主體執行", hrs: hrs });
            }
        });

        const sortedGroups = Object.entries(groups).sort((a, b) => b[1].totalHrs - a[1].totalHrs);

        let html = "";
        sortedGroups.forEach(([mainName, data], idx) => {
            let subItemsHtml = "";
            if (data.items.length > 1 || (data.items.length === 1 && data.items[0].name !== "主體執行")) {
                subItemsHtml = `<ul class="mt-1.5 mb-2 ml-4 space-y-1 text-[10px] text-slate-500 border-l-2 border-slate-100 pl-2">`;
                data.items.sort((a,b) => b.hrs - a.hrs).forEach(item => {
                    subItemsHtml += `
                        <li class="flex justify-between items-center hover:text-slate-700 transition">
                            <span class="truncate pr-2 before:content-['•'] before:mr-1.5 before:text-slate-300">${item.name}</span>
                            <span class="shrink-0">${item.hrs} h</span>
                        </li>`;
                });
                subItemsHtml += `</ul>`;
            }

            html += `
            <div class="border-b border-slate-100 pb-2 mb-2 last:border-0">
                <div class="flex justify-between items-center text-slate-700">
                    <span class="truncate pr-2 font-extrabold text-xs text-slate-800">${idx + 1}. ${mainName}</span> 
                    <span class="text-blue-700 bg-blue-100 px-2 py-0.5 rounded shrink-0 font-black shadow-sm text-xs">${data.totalHrs} h</span>
                </div>
                ${subItemsHtml}
            </div>`;
        });

        rankListEl.innerHTML = html;
    }

        }

    const j6Templates = ["高度投入 {h} 小時於「{p}」專案執行，如期交付階段性任務，確保進度與品質。", "針對「{p}」專案挹注 {h} 小時進行設計與體驗優化，有效提升產出效益。", "主力參與「{p}」專案製作，耗時 {h} 小時與團隊密切配合達成目標。", "高效完成「{p}」相關設計需求（共計 {h} 小時），確保最終產出符合期待。", "負責「{p}」專案之設計落地（投入 {h} 小時），兼顧時效性與視覺完整度。"];
    const j10Templates = ["即時回應主管交辦之設計需求，於本月 {valid} 小時有效工時內皆維持高品質產出。", "積極溝通釐清需求細節，減少來回修改的時間成本，深獲肯定。", "確實達成主管交辦之各項任務，產出符合預期品質。"];
    const j11Templates = ["嚴守團隊紀律，本月維持 {valid} 小時的穩定出勤，落實工時填報與專案進度管理。", "積極與跨部門團隊進行協作溝通，確保各項專案順利落地。", "參與會議並分享實務經驗，促進團隊學習與正向氛圍。"];

    function getLocalText(type, topProjObjs, validH, otH) {
        let shuffled = (arr) => [...arr].sort(() => 0.5 - Math.random());
        if (type === 'j6') {
            if (!topProjObjs || topProjObjs.length === 0) return "1. 穩定交付常態任務，維持業務運作。";
            let lines = [];
            topProjObjs.slice(0,3).forEach((proj, idx) => {
                let tmpl = j6Templates[Math.floor(Math.random() * j6Templates.length)];
                lines.push(`${idx + 1}. ${tmpl.replace('{p}', proj.name).replace('{h}', proj.hrs)}`);
            });
            return lines.join("\n");
        }
        if (type === 'j10') {
            let pool = [...j10Templates];
            if (otH > 0) pool.push(`本月配合專案需求彈性調整，支援 ${otH} 小時加班，確保急件與設計需求高品質交付。`);
            let s = shuffled(pool);
            return `1. ${s[0].replace('{valid}', validH)}\n2. ${s[1].replace('{valid}', validH)}\n3. ${s[2].replace('{valid}', validH)}`;
        }
        if (type === 'j11') {
            let pool = [...j11Templates];
            if (otH > 0) pool.push(`配合團隊運作節奏，適時加班支援同事處理專案設計瓶頸。`);
            let s = shuffled(pool);
            return `1. ${s[0].replace('{valid}', validH)}\n2. ${s[1].replace('{valid}', validH)}\n3. ${s[2].replace('{valid}', validH)}`;
        }
    }

    async function fetchGeminiAI(promptStr) {
        let apiKey = "";
        if (window.firebaseGetDoc && window.firebaseDoc && window.firebaseDB) {
            try {
                const configDoc = await window.firebaseGetDoc(window.firebaseDoc(window.firebaseDB, "config", "system"));
                if (configDoc.exists()) apiKey = configDoc.data().gemini;
            } catch (e) { console.log(e); }
        }
        if (!apiKey) throw new Error("無金鑰");
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: promptStr }] }] })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        let rawText = data.candidates[0].content.parts[0].text.trim().replace(/^```json\s*/, "").replace(/^```\s*/, "").replace(/\s*```$/, "");
        return JSON.parse(rawText);
    }

    window.regenerateSingle = async function(field) {
        const data = window.getComputedMonthData();
        const topProjObjs = Array.from(data.projectMap.entries()).map(([name, hrs]) => ({name, hrs})).sort((a,b) => b.hrs - a.hrs).slice(0,3);
        const pSum = topProjObjs.map(p => `${p.name}(${p.hrs}小時)`).join("、");
        
        setSourceTag(field, 'loading');
        
        let prompt = "";
        if (field === 'j6') prompt = `為 UI/UX 設計師撰寫 KPI 中 J6(專案執行效益)，針對以下專案與時數：${pSum}。請描述產出與效益(分3點)，並務必在句子中自然帶入該專案的「實際時數」以增加可信度。回傳 JSON: {"j6": "..."}`;
        if (field === 'j10') prompt = `為 UI/UX 設計師撰寫 KPI 中 J10(主管滿意度)，描述配合度與溝通(分3點)。本月有效工時 ${data.totalValid}小時、加班 ${data.totalOt}小時，若有加班請於其中一點提及加班時數。回傳 JSON: {"j10": "..."}`;
        if (field === 'j11') prompt = `為 UI/UX 設計師撰寫 KPI 中 J11(團隊滿意度)，描述團隊協作與紀律(分3點)。本月有效工時 ${data.totalValid}小時，請於其中一點提及全月穩定貢獻的總有效工時。回傳 JSON: {"j11": "..."}`;

        try {
            const aiData = await fetchGeminiAI(prompt);
            document.getElementById(`cell${field.toUpperCase()}Input`).value = aiData[field] || aiData.text || aiData;
            setSourceTag(field, 'ai');
        } catch(e) {
            console.log("AI 錯誤，啟動本地備援", e);
            document.getElementById(`cell${field.toUpperCase()}Input`).value = getLocalText(field, topProjObjs, data.totalValid, data.totalOt);
            setSourceTag(field, 'local');
        }
        window.autoSaveCloudData();
    }

    window.generateAllDrafts = async function(isSilent = false) {
        const data = window.getComputedMonthData();
        if (data.totalValid === 0 && data.totalOt === 0) {
            if(!isSilent) alert("無工時資料可產生草稿！"); return;
        }
        const topProjObjs = Array.from(data.projectMap.entries()).map(([name, hrs]) => ({name, hrs})).sort((a,b) => b.hrs - a.hrs).slice(0,3);
        const pSum = topProjObjs.map(p => `- ${p.name}: ${p.hrs}小時`).join("\n");
        setSourceTag('j6', 'loading'); setSourceTag('j10', 'loading'); setSourceTag('j11', 'loading');

        try {
            const prompt = `你是一個專業設計師撰寫 KPI。本月數據如下：
            - 總有效工時：${data.totalValid} 小時
            - 總加班工時：${data.totalOt} 小時
            - 核心專案與投入時數：
            ${pSum}

            請生成以下三個欄位(繁體中文, 各3點，不需前綴標題)：
            1. j6 (專案效益): 挑選前3大專案，請務必在句子中自然帶入該專案的「實際時數」(如: 投入 X 小時於...)，增加真實性。
            2. j10 (主管滿意度): 描述急件處理與配合度，若有加班請務必提及加班時數。
            3. j11 (團隊滿意度): 描述跨部門溝通與紀律，請提及全月穩定貢獻的總有效工時。
            回傳 JSON: {"j6": "...", "j10": "...", "j11": "..."}`;
            
            const aiData = await fetchGeminiAI(prompt);
            document.getElementById('cellJ6Input').value = aiData.j6 || "";
            document.getElementById('cellJ10Input').value = aiData.j10 || "";
            document.getElementById('cellJ11Input').value = aiData.j11 || "";
            setSourceTag('j6', 'ai'); setSourceTag('j10', 'ai'); setSourceTag('j11', 'ai');
        } catch(e) {
            console.log("AI 錯誤，全面切換本地備援", e);
            document.getElementById('cellJ6Input').value = getLocalText('j6', topProjObjs, data.totalValid, data.totalOt);
            document.getElementById('cellJ10Input').value = getLocalText('j10', topProjObjs, data.totalValid, data.totalOt);
            document.getElementById('cellJ11Input').value = getLocalText('j11', topProjObjs, data.totalValid, data.totalOt);
            setSourceTag('j6', 'local'); setSourceTag('j10', 'local'); setSourceTag('j11', 'local');
        }
        window.autoSaveCloudData();

    window.exportFilledKpiWorkbook = async function() {
      if (!window.kpiTemplateArrayBuffer) return alert("請先上傳 KPI 範本 Excel！");
      try {
        const workbook = new ExcelJS.Workbook();
        await workbook.xlsx.load(window.kpiTemplateArrayBuffer);
        const sourceSheet = workbook.worksheets[workbook.worksheets.length - 1];
        const newSheetName = document.getElementById("newSheetNameInput").value.trim();
        const isCrossYear = document.getElementById("crossYearReset").checked;

        if (isCrossYear) while (workbook.worksheets.length > 1) workbook.removeWorksheet(workbook.worksheets[0].id);

        let targetSheet = workbook.getWorksheet(newSheetName);
        if (!targetSheet) {
          targetSheet = workbook.addWorksheet(newSheetName);
          if (sourceSheet.columns) targetSheet.columns = sourceSheet.columns.map(c => ({ width: c.width, style: c.style }));
          sourceSheet.eachRow({ includeEmpty: true }, (row, rNum) => {
            const newRow = targetSheet.getRow(rNum);
            newRow.height = row.height;
            row.eachCell({ includeEmpty: true }, (cell, cNum) => {
              const newCell = newRow.getCell(cNum);
              newCell.value = cell.value;
              newCell.style = JSON.parse(JSON.stringify(cell.style || {}));
            });
          });
          if (sourceSheet.model && sourceSheet.model.merges) sourceSheet.model.merges.forEach(m => { try { targetSheet.mergeCells(m); } catch (e) {} });
        }

        if (isCrossYear) {
          const a1Val = String(targetSheet.getCell("A1").value || "");
          const rocYear = parseInt(document.getElementById("yearSelect").value, 10) - 1911;
          targetSheet.getCell("A1").value = a1Val.replace(/\d+年度/, `${rocYear}年度`);
        }

        targetSheet.getCell("H4").value = Number(document.getElementById("cellH4Input").value) || 120;
        targetSheet.getCell("J4").value = document.getElementById("cellJ4Input").value;
        targetSheet.getCell("J6").value = document.getElementById("cellJ6Input").value;
        targetSheet.getCell("J10").value = document.getElementById("cellJ10Input").value;
        targetSheet.getCell("J11").value = document.getElementById("cellJ11Input").value;
        targetSheet.getCell("H14").value = Number(document.getElementById("cellH14Input").value) || 100;
        targetSheet.getCell("J14").value = document.getElementById("cellJ14Input").value;

        if (isCrossYear && workbook.worksheets.length > 1) {
           const oldId = workbook.worksheets[0].id;
           if (workbook.worksheets[0].name !== newSheetName) workbook.removeWorksheet(oldId);
        }

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `KPI報表_已填寫_${newSheetName}.xlsx`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) { alert("匯出發生錯誤：" + err.message); }
    }
